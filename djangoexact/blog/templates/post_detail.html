{% extends "blog_base.html" %}

{% block content %}
<div class="overflow-hidden">
    <div class="max-w-8xl mx-auto">
        <div class="flex px-4 pt-8 pb-10 lg:px-8"><a
                class="group flex font-semibold text-sm leading-6 text-slate-700 hover:text-slate-900 dark:text-slate-200 dark:hover:text-white"
                href="/blog/"><svg viewBox="0 -9 3 24"
                    class="overflow-visible mr-3 text-slate-400 w-auto h-6 group-hover:text-slate-600 dark:group-hover:text-slate-300">
                    <path d="M3 0L0 3L3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"></path>
                </svg>Go back</a></div>
    </div>
    <div class="px-4 sm:px-6 md:px-8">
        <div class="max-w-3xl mx-auto">
            <main>
                <article class="relative pt-10">
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-slate-200 md:text-3xl ">
                        {{ post.title }}
                    </h1>
                    <div class="text-sm leading-6">
                        <dl>
                            <dt class="sr-only">Date</dt>
                            <dd class="absolute top-0 inset-x-0 text-slate-700 dark:text-slate-400">
                                <time datetime="{{ post.date_created }}">{{ post.date_created|date:"F j, Y" }}</time>
                            </dd>
                        </dl>
                    </div>
                    
                    <div class="">
                        <ul class="flex flex-wrap text-sm leading-6 -mt-6 -mx-5">
                            <li class="flex items-center font-medium whitespace-nowrap px-5 mt-6">
                                {% comment %} <img src="/_next/static/media/danhollick.ee205d2a.jpg" alt="" class="mr-3 w-9 h-9 rounded-full bg-slate-50 dark:bg-slate-800" decoding="async"> {% endcomment %}
                                <div class="text-sm leading-4">
                                    <div class="text-slate-900 dark:text-slate-200">{{post.author.first_name}} {{post.author.last_name}}</div>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <div class="mt-12 prose prose-slate dark:prose-slate text-justify">
                            {{ post.content|safe }}
                    </div>
                </article>
            </main>
        </div>
    </div>
</div>
{% endblock %}
