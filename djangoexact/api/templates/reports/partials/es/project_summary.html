{% load humanize %}
<section>
    <div class="card mb-4">
        <div class="card-header bg-dark text-white">
            <h3>Resumen del Proyecto</h3>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <h4 class="text-center">Resumen del Proyecto</h4>
                <hr />
                <div class="col-sm-6 text-start">
                    <p>
                        <strong>Área Total (hectáreas):</strong>
                        {{ total_area|floatformat:2|intcomma }}
                    </p>
                    <p>
                        <strong>Total de Cabezas:</strong> {{ total_heads|floatformat:2|intcomma }}
                    </p>
                    <p>
                        <strong>Total de Toneladas de Captura:</strong>
                        {{ total_tonnes_of_catch|floatformat:2|intcomma }}
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
