<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX-ACT</title>
    {# Tailwind Play CDN is dynamically generated per-request, so SRI is not applicable. #}
    {# nosemgrep: html.security.audit.missing-integrity.missing-integrity #}
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="flex flex-col justify-center items-center h-screen space-y-4">
        <div class="text-center">
            <h1 class="text-3xl font-bold">Invitation can't be accepted</h1>
            <p class="text-lg">{{ reason }}</p>
            <p class="text-lg">Ask a project Admin of <b>{{ project_name }}</b> to send you a new invitation.</p>
        </div>
        <div class="text-center">
            <a href="{{link}}"
                class="mt-4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Go to EX-ACT</a>
        </div>
    </div>
</body>

</html>
