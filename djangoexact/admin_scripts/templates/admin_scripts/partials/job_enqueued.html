<li class="text-green-700">
    {{ job.module_type }} / {{ job.attribute }}: {{ job.from_value }} → {{ job.to_value }}
    — <span class="font-medium">Job #{{ job.pk }} enqueued</span>
    <span hx-get="{% url 'admin_scripts:htmx-job-status' %}?job_id={{ job.pk }}"
          hx-trigger="every 5s [this.textContent.indexOf('Completed') === -1 && this.textContent.indexOf('Failed') === -1 && this.textContent.indexOf('Cancelled') === -1]"
          hx-swap="innerHTML">
        <span class="text-amber-600">⏳ Pending</span>
    </span>
</li>
