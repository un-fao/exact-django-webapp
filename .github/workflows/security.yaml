name: Security Scan

on:
  push:
    branches: [main, develop, review]
  pull_request:
    branches: [main, develop, review]
  schedule:
    # Weekly scan on Mondays at 07:00 UTC
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  python-audit:
    name: Python dependency & code scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r djangoexact/requirements.txt --strict
        continue-on-error: false

      - name: bandit (static analysis of Python source)
        run: |
          bandit -r djangoexact \
            -x djangoexact/venv,djangoexact/node_modules,djangoexact/static \
            -ll

  npm-audit:
    name: npm dependency scan
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: djangoexact
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: djangoexact/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
