name: Deploy

on:
  push:
    branches:
      - main
      - review
      - feature/id-responses

jobs:  
  deploy:
    runs-on: ubuntu-22.04
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'review' && 'review' || 'develop' }}
    permissions:
      id-token: 'write'
      contents: 'read'
      actions: 'read'
    steps:
    - name: 'Checkout Code'
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: ${{ vars.WORKLOAD_ID_PROVIDER }}
        service_account: ${{ vars.SERVICE_ACCOUNT }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
      
    - name: Setup cloud-sql-proxy
      run: |
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy
        ./cloud-sql-proxy -g -p ${{ vars.DB_PORT }} ${{ vars.DB_INSTANCE_CONNECTION }} &

    - name: Deploy
      env:
        DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        set -x

        sed -i 's|\$SERVICE_NAME|${{ vars.SERVICE_NAME }}|g' djangoexact/app.yaml
        sed -i 's|\$PROJECT_ID|${{ vars.PROJECT_ID }}|g' djangoexact/app.yaml
        sed -i 's|\$DB_ENGINE|${{ vars.DB_ENGINE }}|g' djangoexact/app.yaml
        sed -i 's|\$DB_HOST|${{ vars.DB_HOST }}|g' djangoexact/app.yaml
        sed -i 's|\$DB_USERNAME|${{ vars.DB_USERNAME }}|g' djangoexact/app.yaml
        sed -i 's|\$DB_PASSWORD|${{ secrets.DB_PASSWORD }}|g' djangoexact/app.yaml
        sed -i 's|\$DB_NAME|${{ vars.DB_NAME }}|g' djangoexact/app.yaml
        sed -i 's|\$DB_PORT|${{ vars.DB_PORT }}|g' djangoexact/app.yaml
        sed -i 's|\$STORAGE_BUCKET|${{ vars.STORAGE_BUCKET }}|g' djangoexact/app.yaml
        sed -i 's|\$SECRET_KEY|${{ secrets.SECRET_KEY }}|g' djangoexact/app.yaml
        sed -i 's|\$DJANGO_DEBUG|${{ vars.DJANGO_DEBUG }}|g' djangoexact/app.yaml
        sed -i 's|\$ALLOWED_HOSTS|${{ vars.ALLOWED_HOSTS }}|g' djangoexact/app.yaml
        sed -i 's|\$CORS_ALLOWED_ORIGINS|${{ vars.CORS_ALLOWED_ORIGINS }}|g' djangoexact/app.yaml
        sed -i 's|\$CLOUD_RUN_COMPUTATION_JOB_NAME|${{ vars.CLOUD_RUN_COMPUTATION_JOB_NAME }}|g' djangoexact/app.yaml
        sed -i 's|\$CLOUD_RUN_REGION|${{ vars.CLOUD_RUN_REGION }}|g' djangoexact/app.yaml

        # NOTE: do NOT echo app.yaml — it contains injected DB_PASSWORD and SECRET_KEY after substitution.

        sed -i 's|\$DB_ENGINE|${{ vars.DB_ENGINE }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$DB_INSTANCE_CONNECTION|${{ vars.DB_INSTANCE_CONNECTION }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$DB_HOST|${{ vars.DB_HOST }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$DB_USERNAME|${{ vars.DB_USERNAME  }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$DB_PASSWORD|${{ secrets.DB_PASSWORD }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$DB_NAME|${{ vars.DB_NAME }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$DB_PORT|${{ vars.DB_PORT }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$ALLOWED_HOST|${{ vars.ALLOWED_HOST }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$SECRET_KEY|${{ secrets.SECRET_KEY }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$EMAIL_HOST|${{ vars.EMAIL_HOST }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$EMAIL_PORT|${{ vars.EMAIL_PORT }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$SMTP_USER_EMAIL|${{ vars.SMTP_USER_EMAIL }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$SMTP_USER_PASSWORD|${{ secrets.SMTP_USER_PASSWORD }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$FIREBASE_API_KEY|${{ vars.FIREBASE_API_KEY }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$FIREBASE_AUTH_DOMAIN|${{ vars.FIREBASE_AUTH_DOMAIN }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$FIREBASE_PROJECT_ID|${{ vars.FIREBASE_PROJECT_ID }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$FIREBASE_STORAGE_BUCKET|${{ vars.FIREBASE_STORAGE_BUCKET }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$FIREBASE_MESSAGING_SENDER_ID|${{ vars.FIREBASE_MESSAGING_SENDER_ID }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$FIREBASE_APP_ID|${{ vars.FIREBASE_APP_ID }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$FIREBASE_MEASUREMENT_ID|${{ vars.FIREBASE_MEASUREMENT_ID }}|g' djangoexact/djangoexact/settings.py
        sed -i 's|\$FIREBASE_SERVICE_ACCOUNT|${{ secrets.FIREBASE_SERVICE_ACCOUNT }}|g' djangoexact/djangoexact/settings.py

        # NOTE: do NOT echo settings.py — it contains injected DB_PASSWORD, SECRET_KEY,
        # SMTP_USER_PASSWORD and FIREBASE_SERVICE_ACCOUNT after substitution.

        cd djangoexact
        
        pip install --upgrade pip 'setuptools>=78.1.1' wheel
        pip install -r requirements.txt --no-cache-dir
        pip install --force-reinstall 'setuptools>=78.1.1'
        # - yes | python manage.py makemigrations --merge
        python manage.py migrate
        python manage.py collectstatic --noinput

        pip list
        sed -i "s|127.0.0.1|${{ vars.DB_HOST }}|g" djangoexact/settings.py

        python manage.py runscript invalidate_results_cache

        gcloud config set project ${{ vars.PROJECT_ID }}
        gcloud app deploy app.yaml --project ${{ vars.PROJECT_ID }} --verbosity=debug
        gcloud app versions list --service=${{ vars.SERVICE_NAME }} --project=${{ vars.PROJECT_ID }} --format="value(version.id)" --sort-by="~version.createTime" | tail -n +100 | xargs -r gcloud app versions delete -q

    - name: Build computation-job image
      if: vars.CLOUD_RUN_COMPUTATION_JOB_NAME != ''
      env:
        SHA: ${{ github.sha }}
        PROJECT_ID: ${{ vars.PROJECT_ID }}
      # Build with docker on the runner and push directly to gcr.io. We previously
      # used `gcloud builds submit` but the deploy SA is blocked by an org policy
      # from accessing the Cloud Build staging bucket; bypassing the Cloud Build
      # API entirely sidesteps that. deploy/cloudbuild-computation-job.yaml is
      # kept for ad-hoc manual builds via `gcloud builds submit`.
      run: |
        gcloud auth configure-docker gcr.io --quiet
        docker build \
          -f deploy/Dockerfile.computation_job \
          -t "gcr.io/$PROJECT_ID/exact-computation-job:$SHA" \
          -t "gcr.io/$PROJECT_ID/exact-computation-job:latest" \
          .
        docker push "gcr.io/$PROJECT_ID/exact-computation-job:$SHA"
        docker push "gcr.io/$PROJECT_ID/exact-computation-job:latest"

    - name: Deploy/update Cloud Run Job
      if: vars.CLOUD_RUN_COMPUTATION_JOB_NAME != ''
      # We avoid passing secret values through `gcloud --set-env-vars` because
      # GitHub Actions' interpolation of secrets containing $ into the YAML
      # env: block (or bash double-quoting them on the CLI) silently mangles
      # them — observed: DB_PASSWORD and SECRET_KEY each gained 2 extra chars
      # on Cloud Run vs the working App Engine values, breaking psycopg2 auth.
      #
      # Instead we hand the values to Python via step env vars and let Python
      # write a YAML file consumed by `gcloud run jobs deploy --env-vars-file`.
      # Python's os.environ + yaml.safe_dump preserves the values verbatim.
      env:
        SHA: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        SMTP_USER_PASSWORD: ${{ secrets.SMTP_USER_PASSWORD }}
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        DB_ENGINE: ${{ vars.DB_ENGINE }}
        DB_INSTANCE_CONNECTION: ${{ vars.DB_INSTANCE_CONNECTION }}
        DB_USERNAME: ${{ vars.DB_USERNAME }}
        DB_NAME: ${{ vars.DB_NAME }}
        DB_PORT: ${{ vars.DB_PORT }}
        ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
        STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
        PROJECT_ID: ${{ vars.PROJECT_ID }}
        DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
        EMAIL_HOST: ${{ vars.EMAIL_HOST }}
        EMAIL_PORT: ${{ vars.EMAIL_PORT }}
        SMTP_USER_EMAIL: ${{ vars.SMTP_USER_EMAIL }}
        FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      run: |
        python3 - <<'PYEOF' > /tmp/job-env.yaml
        import os, sys, yaml
        keys = [
            "DB_ENGINE", "DB_USER", "DB_PASSWORD", "DB_NAME", "DB_PORT",
            "DB_HOST",
            "SECRET_KEY", "ALLOWED_HOSTS", "STORAGE_BUCKET", "PROJECT_ID",
            "DJANGO_DEBUG", "BRANCH_NAME",
            "EMAIL_HOST", "EMAIL_PORT", "SMTP_USER_EMAIL", "SMTP_USER_PASSWORD",
            "FIREBASE_API_KEY", "FIREBASE_AUTH_DOMAIN", "FIREBASE_PROJECT_ID",
            "FIREBASE_STORAGE_BUCKET", "FIREBASE_MESSAGING_SENDER_ID",
            "FIREBASE_APP_ID", "FIREBASE_MEASUREMENT_ID",
            "FIREBASE_SERVICE_ACCOUNT", "JOB_NOTIFICATIONS_ENABLED",
        ]
        # Derive a couple of values, then pull everything else verbatim from
        # the process env. Two renames: DB_USER comes from DB_USERNAME, and
        # BRANCH_NAME from REF_NAME (settings.py reads DB_USER; the original
        # github.ref_name flows through REF_NAME).
        env = {
            "DB_USER": os.environ["DB_USERNAME"],
            "BRANCH_NAME": os.environ["REF_NAME"],
            "DB_HOST": f"/cloudsql/{os.environ['DB_INSTANCE_CONNECTION']}",
            "JOB_NOTIFICATIONS_ENABLED": "True",
        }
        for k in keys:
            if k in env:
                continue
            env[k] = os.environ[k]
        yaml.safe_dump(env, sys.stdout, default_flow_style=False, allow_unicode=True)
        PYEOF
        gcloud run jobs deploy exact-computation-job \
          --image="gcr.io/$PROJECT_ID/exact-computation-job:$SHA" \
          --region=${{ vars.CLOUD_RUN_REGION }} \
          --project="$PROJECT_ID" \
          --service-account="$PROJECT_ID@appspot.gserviceaccount.com" \
          --set-cloudsql-instances="$DB_INSTANCE_CONNECTION" \
          --memory=4Gi \
          --cpu=2 \
          --task-timeout=3600 \
          --max-retries=0 \
          --env-vars-file=/tmp/job-env.yaml

    - name: Create Issue
      if: failure()
      uses: un-fao/fao-ga-create-issue@v2