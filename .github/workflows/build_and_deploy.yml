name: Build and Deploy
on:
  push:
    branches:
      - _develop
      - develop
      - review
  pull_request:
    branches:
      - main
  workflow_dispatch:
    # paths-ignore:
      # - .github/**

jobs:
  set-environment:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    outputs:
      env: ${{ steps.set_env.outputs.env }}
    steps:
      - name: Set environment
        id: set_env
        run: | 
          case "${{ github.ref_name }}" in
            develop|review)
              echo "env=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              ;;
            _develop)
              echo "env=develop" >> "$GITHUB_OUTPUT"
              ;;
            *)
              ;;
          esac

  deploy:
    runs-on: ubuntu-22.04
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.env }}
    env:
      VARS: ${{ toJson(vars) }}
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Expose GitHub Variables
        run: echo "$VARS" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Expose Github secrets
        run: |
          echo "DB_PASSWORD='${{ secrets.DB_PASSWORD }}'" >> $GITHUB_ENV
          echo "FIREBASE_PRIVATE_KEY='${{ secrets.SMTP_USER_PASSWORD }}'" >> $GITHUB_ENV
          echo "FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'" >> $GITHUB_ENV
          echo "SECRET_KEY='${{ secrets.SECRET_KEY }}'" >> $GITHUB_ENV
          echo "SMTP_USER_PASSWORD='${{ secrets.SMTP_USER_PASSWORD }}'" >> $GITHUB_ENV

      - name: show all env vars
        run: printenv

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: $WORKLOAD_ID_PROVIDER }}
          service_account: $SERVICE_ACCOUNT }}

      - name: Check Auth
        run: gcloud auth list

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Setup cloud-sql-proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy -g -p $DB_PORT }} $DB_INSTANCE_CONNECTION }} &

      - name: Test cloud-sql-proxy
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          sudo apt-get install -y postgresql-client
          psql --host=127.0.0.1 --port=$DB_PORT --username=$DB_USERNAME --dbname=$DB_NAME -c "\dt"

      - name: Replace vars in app.yaml
        run: |
          sed -i "s|\$SERVICE_NAME|$SERVICE_NAME|g" djangoexact/app.yaml
          sed -i "s|\$PROJECT_ID|$PROJECT_ID|g" djangoexact/app.yaml
          sed -i "s|\$DB_ENGINE|$DB_ENGINE|g" djangoexact/app.yaml
          sed -i "s|\$DB_HOST|$DB_HOST|g" djangoexact/app.yaml
          sed -i "s|\$DB_USERNAME|$DB_USERNAME|g" djangoexact/app.yaml
          sed -i "s|\$DB_PASSWORD|$DB_PASSWORD|g" djangoexact/app.yaml
          sed -i "s|\$DB_NAME|$DB_NAME|g" djangoexact/app.yaml
          sed -i "s|\$DB_PORT|$DB_PORT|g" djangoexact/app.yaml
          sed -i "s|\$SECRET_KEY|$SECRET_KEY|g" djangoexact/app.yaml

      - run: cat djangoexact/app.yaml

      - name: Replace vars in settings.py
        run: |
          sed -i "s|os.getenv(\"DB_ENGINE\")|\"$DB_ENGINE\"|g" djangoexact/djangoexact/settings.py
          sed -i "s|os.getenv(\"DB_HOST\")|\"127.0.0.1\"|g" djangoexact/djangoexact/settings.py
          sed -i "s|os.getenv(\"DB_USERNAME\")|\"$DB_USERNAME\"|g" djangoexact/djangoexact/settings.py
          sed -i "s|os.getenv(\"DB_PASSWORD\")|\"$DB_PASSWORD\"|g" djangoexact/djangoexact/settings.py
          sed -i "s|os.getenv(\"DB_NAME\")|\"$DB_NAME\"|g" djangoexact/djangoexact/settings.py
          sed -i "s|os.getenv(\"DB_PORT\")|\"$DB_PORT\"|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$ALLOWED_HOST|$ALLOWED_HOST|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$SECRET_KEY|$SECRET_KEY|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$EMAIL_HOST|$EMAIL_HOST|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$EMAIL_PORT|$EMAIL_PORT|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$SMTP_USER_EMAIL|$SMTP_USER_EMAIL|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$SMTP_USER_PASSWORD|$SMTP_USER_PASSWORD|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$FIREBASE_API_KEY|$FIREBASE_API_KEY|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$FIREBASE_AUTH_DOMAIN|$FIREBASE_AUTH_DOMAIN|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$FIREBASE_PROJECT_ID|$FIREBASE_PROJECT_ID|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$FIREBASE_STORAGE_BUCKET|$FIREBASE_STORAGE_BUCKET|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$FIREBASE_MESSAGING_SENDER_ID|$FIREBASE_MESSAGING_SENDER_ID|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$FIREBASE_APP_ID|$FIREBASE_APP_ID|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$FIREBASE_MEASUREMENT_ID|$FIREBASE_MEASUREMENT_ID|g" djangoexact/djangoexact/settings.py
          sed -i "s|\$FIREBASE_SERVICE_ACCOUNT|$FIREBASE_SERVICE_ACCOUNT|g" djangoexact/djangoexact/settings.py

      - run: cat djangoexact/djangoexact/settings.py

      - run: pip install -r djangoexact/requirements.txt
      - run: cd djangoexact/ && python manage.py migrate
      - run: cd djangoexact/ && python manage.py collectstatic --noinput
      - run: cd djangoexact/ && python manage.py update_translation_fields
      - run: cd djangoexact/ && python manage.py sync_translation_fields

      - name: Replace and Remove DB vars for GAE
        run: |
          sed -i "s|\"127.0.0.1\"|\"/cloudsql/$DB_INSTANCE_CONNECTION\"|g" djangoexact/djangoexact/settings.py
          sed -i "/\"PORT\":/d" djangoexact/djangoexact/settings.py
        
      - name: Deploy
        run: |
          gcloud app deploy djangoexact/app.yaml --project $PROJECT_ID --verbosity=debug
          gcloud app versions list --service=$SERVICE_NAME --project=$PROJECT_ID --format="value(version.id)" --sort-by="~version.createTime" | tail -n +100 | xargs -r gcloud app versions delete -q
      
      - name: Create Issue
        if: failure()
        uses: ./.github/utility/create_issue
