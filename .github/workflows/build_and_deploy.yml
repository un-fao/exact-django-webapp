name: Build and Deploy
on:
  push:
    branches:
      - _develop
      # - review
  # pull_request:
  #   branches:
      # - main
    # paths-ignore:
      # - .github/**

jobs:
  set-environment:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    outputs:
      env: ${{ steps.set_env.outputs.env }}
    steps:
      - name: Set environment
        id: set_env
        run: | 
          case "${{ github.ref_name }}" in
            develop|review)
              echo "env=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              ;;
            _develop)
              echo "env=develop" >> "$GITHUB_OUTPUT"
              ;;
            *)
              ;;
          esac

  deploy:
    runs-on: ubuntu-22.04
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.env }}
    env:
      VARS: ${{ toJson(vars) }}
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Expose GitHub Variables
        run: echo "$VARS" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Expose Github secrets
        run: |
          echo "DB_PASSWORD='${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "FIREBASE_PRIVATE_KEY='${{ secrets.SMTP_USER_PASSWORD }}" >> $GITHUB_ENV
          echo "FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" >> $GITHUB_ENV
          echo "SECRET_KEY='${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          echo "SMTP_USER_PASSWORD='${{ secrets.SMTP_USER_PASSWORD }}" >> $GITHUB_ENV

      - name: show all env vars
        run: printenv

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Check Auth
        run: gcloud auth list

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Setup cloud-sql-proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy -g -p ${{ vars.DB_PORT }} ${{ vars.DB_INSTANCE_CONNECTION }} &

      - name: Test cloud-sql-proxy
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          sudo apt-get install -y postgresql-client
          psql --host=127.0.0.1 --port=${{ vars.DB_PORT }} --username=${{ vars.DB_USERNAME }} --dbname=${{ vars.DB_NAME }} -c "\dt"
  
      - uses: flcdrg/replace-multiple-action@v1
        with:
          files: 'djangoexact/app.yaml, djangoexact/djangoexact/settings.py'
          find: '[
            { "find": "$SERVICE_NAME", "replace": "${{ vars.SERVICE_NAME }}" },
            { "find": "$PROJECT_ID", "replace": "${{ vars.PROJECT_ID }}" },
            { "find": "$DB_ENGINE", "replace": "${{ vars.DB_ENGINE }}" },
            { "find": "$DB_HOST", "replace": "${{ vars.DB_HOST }}" },
            { "find": "$DB_USERNAME", "replace": "${{ vars.DB_USERNAME }}" },
            { "find": "$DB_PASSWORD", "replace": "${{ secrets.DB_PASSWORD }}" },
            { "find": "$DB_NAME", "replace": "${{ vars.DB_NAME }}" },
            { "find": "$DB_PORT", "replace": "${{ vars.DB_PORT }}" },
            { "find": "$SECRET_KEY", "replace": "${{ secrets.SECRET_KEY }}" },
            { "find": "$ALLOWED_HOST", "replace": "${{ vars.ALLOWED_HOST }}" },
            { "find": "$EMAIL_HOST", "replace": "${{ vars.EMAIL_HOST }}" },
            { "find": "$EMAIL_PORT", "replace": "${{ vars.EMAIL_PORT }}" },
            { "find": "$SMTP_USER_EMAIL", "replace": "${{ vars.SMTP_USER_EMAIL }}" },
            { "find": "$SMTP_USER_PASSWORD", "replace": "${{ secrets.SMTP_USER_PASSWORD }}" },
            { "find": "$FIREBASE_API_KEY", "replace": "${{ vars.FIREBASE_API_KEY }}" },
            { "find": "$FIREBASE_AUTH_DOMAIN", "replace": "${{ vars.FIREBASE_AUTH_DOMAIN }}" },
            { "find": "$FIREBASE_PROJECT_ID", "replace": "${{ vars.FIREBASE_PROJECT_ID }}" },
            { "find": "$FIREBASE_STORAGE_BUCKET", "replace": "${{ vars.FIREBASE_STORAGE_BUCKET }}" },
            { "find": "$FIREBASE_MESSAGING_SENDER_ID", "replace": "${{ vars.FIREBASE_MESSAGING_SENDER_ID }}" },
            { "find": "$FIREBASE_APP_ID", "replace": "${{ vars.FIREBASE_APP_ID }}" },
            { "find": "$FIREBASE_MEASUREMENT_ID", "replace": "${{ vars.FIREBASE_MEASUREMENT_ID }}" },
            { "find": "$FIREBASE_SERVICE_ACCOUNT", "replace": "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }]'

      - run: pip install -r djangoexact/requirements.txt
      - run: cd djangoexact/ && python manage.py migrate
      - run: cd djangoexact/ && python manage.py collectstatic --noinput
      - run: cd djangoexact/ && python manage.py update_translation_fields
      - run: cd djangoexact/ && python manage.py sync_translation_fields

      - name: Deploy
        run: |
          gcloud app deploy djangoexact/app.yaml --project ${{ vars.PROJECT_ID }} --verbosity=debug
          gcloud app versions list --service=${{ vars.SERVICE_NAME }} --project=${{ vars.PROJECT_ID }} --format="value(version.id)" --sort-by="~version.createTime" | tail -n +100 | xargs -r gcloud app versions delete -q
      
      - name: Create Issue
        if: failure()
        uses: ./.github/utility/create_issue
